<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1050" height="596" viewBox="0 0 1050 596" role="img" font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, Sans Serif"><title>Proposed feedback inhibits the relay</title><desc>A synthetic cue activates a membrane relay, which activates an intracellular response. The response is proposed to inhibit the relay.</desc><rect x="0" y="0" width="1050" height="596" fill="#FFFFFF" /><g id="headline" inkscape:groupmode="layer" inkscape:label="headline"><text x="45" y="62" fill="#192633" font-size="34" font-weight="700" text-anchor="start" id="headline-1">Proposed feedback inhibits the relay</text><text x="46" y="96" fill="#415663" font-size="17" font-weight="400" text-anchor="start" id="headline-2">Illustrative circuit with source-linked activity and location</text></g><g id="compartments" inkscape:groupmode="layer" inkscape:label="compartments"><rect x="43" y="142" width="965" height="348" rx="20" fill="#F2F6F6" stroke="none" stroke-width="2" id="compartments-1" /><rect x="43" y="142" width="965" height="80" rx="19" fill="#EDF5F4" stroke="none" stroke-width="2" id="compartments-2" /><rect x="43" y="224" width="965" height="27" rx="0" fill="#C8DDDA" stroke="none" stroke-width="2" id="compartments-3" /><polyline points="43.00000,227.00000 1008.00000,227.00000" fill="none" stroke="#90AEA9" stroke-width="1.1" stroke-linejoin="round" id="compartments-4" /><polyline points="43.00000,248.00000 1008.00000,248.00000" fill="none" stroke="#90AEA9" stroke-width="1.1" stroke-linejoin="round" id="compartments-5" /><text x="65" y="179" fill="#415663" font-size="18" font-weight="700" text-anchor="start" id="compartments-6">Outside</text><text x="65" y="244" fill="#415663" font-size="15" font-weight="700" text-anchor="start" id="compartments-7">Membrane</text><text x="65" y="284" fill="#415663" font-size="18" font-weight="700" text-anchor="start" id="compartments-8">Inside</text></g><g id="cue" inkscape:groupmode="layer" inkscape:label="cue"><rect x="338" y="161" width="36" height="36" rx="18" fill="#086F75" stroke="none" stroke-width="2" id="cue-1" /><rect x="351" y="174" width="10" height="10" rx="5" fill="#FFFFFF" stroke="none" stroke-width="2" id="cue-2" /><text x="390" y="187" fill="#192633" font-size="22" font-weight="700" text-anchor="start" id="cue-3">Cue</text></g><g id="relay" inkscape:groupmode="layer" inkscape:label="relay"><rect x="325" y="221" width="62" height="38" rx="12" fill="#086F75" stroke="none" stroke-width="2" id="relay-1" /><rect x="344" y="226" width="24" height="29" rx="4" fill="#FFFFFF" stroke="none" stroke-width="2" id="relay-2" /><text x="258" y="246" fill="#192633" font-size="21" font-weight="700" text-anchor="start" id="relay-3">Relay</text></g><g id="response" inkscape:groupmode="layer" inkscape:label="response"><rect x="565" y="348" width="233" height="64" rx="12" fill="#DCEDEA" stroke="#086F75" stroke-width="2" id="response-1" /><text x="680" y="388" fill="#192633" font-size="26" font-weight="700" text-anchor="middle" id="response-2">Response</text></g><g id="trigger" inkscape:groupmode="layer" inkscape:label="trigger"><polyline points="356.00000,199.00000 356.00000,221.00000" fill="none" stroke="#086F75" stroke-width="3" stroke-linejoin="round" id="trigger-1" /><polyline points="349.20000,208.00000 356.00000,221.00000 362.80000,208.00000" stroke="#086F75" fill="none" stroke-width="3" stroke-linejoin="round" data-glyph="arrow" /></g><g id="activation" inkscape:groupmode="layer" inkscape:label="activation"><polyline points="356.00000,259.00000 356.00000,380.00000 565.00000,380.00000" fill="none" stroke="#086F75" stroke-width="3" stroke-linejoin="round" id="activation-1" /><polyline points="552.00000,386.80000 565.00000,380.00000 552.00000,373.20000" stroke="#086F75" fill="none" stroke-width="3" stroke-linejoin="round" data-glyph="arrow" /></g><g id="feedback" inkscape:groupmode="layer" inkscape:label="feedback"><polyline points="798.00000,380.00000 899.00000,380.00000 899.00000,240.00000 387.00000,240.00000" fill="none" stroke="#A44532" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5" id="feedback-1" /><polyline points="387.00000,232.50000 387.00000,240.00000 387.00000,247.50000" stroke="#A44532" fill="none" stroke-width="3" stroke-linejoin="round" data-glyph="bar" /><text x="886" y="303" fill="#A44532" font-size="21" font-weight="700" text-anchor="end" id="feedback-2">Proposed</text><text x="886" y="328" fill="#A44532" font-size="19" font-weight="400" text-anchor="end" id="feedback-3">inhibition</text></g><g id="legend" inkscape:groupmode="layer" inkscape:label="legend"><polyline points="47.00000,530.00000 101.00000,530.00000" fill="none" stroke="#086F75" stroke-width="3" stroke-linejoin="round" id="legend-1" /><polyline points="92.00000,524.00000 101.00000,530.00000 92.00000,536.00000" fill="none" stroke="#086F75" stroke-width="3" stroke-linejoin="round" id="legend-2" /><text x="116" y="536" fill="#192633" font-size="18" font-weight="400" text-anchor="start" id="legend-3">Activation</text><polyline points="276.00000,530.00000 330.00000,530.00000" fill="none" stroke="#A44532" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5" id="legend-4" /><polyline points="330.00000,522.00000 330.00000,538.00000" fill="none" stroke="#A44532" stroke-width="3" stroke-linejoin="round" id="legend-5" /><text x="344" y="536" fill="#192633" font-size="18" font-weight="400" text-anchor="start" id="legend-6">Proposed inhibition</text><text x="47" y="570" fill="#415663" font-size="14" font-weight="400" text-anchor="start" id="legend-7">Synthetic example. A dashed flat-ended connector separates uncertainty from effect sign.</text></g></svg>