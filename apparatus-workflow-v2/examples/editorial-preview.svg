<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1050" height="623" viewBox="0 0 1050 623" role="img" font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, Sans Serif"><title>Two pressure paths give airspeed</title><desc>Cross-section of a Pitot-static probe with physically separate total-pressure and static-pressure passages to a differential pressure sensor.</desc><rect x="0" y="0" width="1050" height="623" fill="#FFFFFF" /><g id="headline" inkscape:groupmode="layer" inkscape:label="headline"><text x="47" y="67" fill="#192633" font-size="40" font-weight="700" text-anchor="start" id="headline-1">Two pressure paths give airspeed</text><text x="48" y="101" fill="#415663" font-size="18" font-weight="400" text-anchor="start" id="headline-2">Pitot–static probe cross-section and differential readout</text></g><g id="orientation" inkscape:groupmode="layer" inkscape:label="orientation"><text x="74" y="180" fill="#192633" font-size="18" font-weight="700" text-anchor="start" id="orientation-1">Incoming airflow</text><polyline points="76.00000,204.00000 226.00000,204.00000" fill="none" stroke="#CCD8DC" stroke-width="2.5" stroke-linejoin="round" id="orientation-2" /><polyline points="216.00000,198.00000 226.00000,204.00000 216.00000,210.00000" fill="none" stroke="#CCD8DC" stroke-width="2.5" stroke-linejoin="round" id="orientation-3" /></g><g id="probe" inkscape:groupmode="layer" inkscape:label="probe"><path d="M241,232 L574,232 L605,259 L605,440 L541,440 L541,298 L241,298 Z" fill="#EDF1F2" stroke="#8499A2" stroke-width="2" id="probe-1" /><rect x="241" y="252" width="26" height="26" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" id="probe-2" /><rect x="402" y="228" width="15" height="16" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" id="probe-3" /><rect x="437" y="228" width="15" height="16" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" id="probe-4" /></g><g id="sensor" inkscape:groupmode="layer" inkscape:label="sensor"><rect x="481" y="438" width="185" height="79" rx="11" fill="#F2F6F6" stroke="#9AB0BA" stroke-width="2" id="sensor-1" /><text x="573" y="483" fill="#192633" font-size="18" font-weight="700" text-anchor="middle" id="sensor-2">Differential sensor</text></g><g id="total-channel" inkscape:groupmode="layer" inkscape:label="total-channel"><polyline points="241.00000,266.00000 557.00000,266.00000 557.00000,438.00000" fill="none" stroke="#A44532" stroke-width="5" stroke-linejoin="round" id="total-channel-1" /><text x="238" y="324" fill="#A44532" font-size="18" font-weight="700" text-anchor="start" id="total-channel-2">Forward opening</text><text x="238" y="349" fill="#A44532" font-size="17" font-weight="400" text-anchor="start" id="total-channel-3">Total pressure pₜ</text></g><g id="static-channel" inkscape:groupmode="layer" inkscape:label="static-channel"><polyline points="409.00000,233.00000 409.00000,247.00000 590.00000,247.00000 590.00000,438.00000" fill="none" stroke="#2C5E98" stroke-width="5" stroke-linejoin="round" id="static-channel-1" /><polyline points="444.00000,233.00000 444.00000,247.00000" fill="none" stroke="#2C5E98" stroke-width="5" stroke-linejoin="round" id="static-channel-2" /><text x="420" y="193" fill="#2C5E98" font-size="18" font-weight="700" text-anchor="middle" id="static-channel-3">Side openings</text><text x="420" y="215" fill="#2C5E98" font-size="16" font-weight="400" text-anchor="middle" id="static-channel-4">Static pressure pₛ</text></g><g id="calculation" inkscape:groupmode="layer" inkscape:label="calculation"><polyline points="715.00000,160.00000 715.00000,520.00000" fill="none" stroke="#CCD8DC" stroke-width="1" stroke-linejoin="round" id="calculation-1" /><text x="750" y="216" fill="#415663" font-size="19" font-weight="700" text-anchor="start" id="calculation-2">Pressure difference</text><text x="748" y="280" fill="#192633" font-size="34" font-weight="700" text-anchor="start" id="calculation-3">Δp = pₜ − pₛ</text><text x="750" y="345" fill="#415663" font-size="19" font-weight="700" text-anchor="start" id="calculation-4">Airspeed</text><text x="747" y="407" fill="#086F75" font-size="32" font-weight="700" text-anchor="start" id="calculation-5">V = √(2Δp/ρ)</text><text x="749" y="452" fill="#415663" font-size="15" font-weight="400" text-anchor="start" id="calculation-6">Incompressible approximation</text></g><g id="note" inkscape:groupmode="layer" inkscape:label="note"><polyline points="46.00000,555.00000 1004.00000,555.00000" fill="none" stroke="#CCD8DC" stroke-width="1" stroke-linejoin="round" id="note-1" /><text x="47" y="581" fill="#415663" font-size="15" font-weight="400" text-anchor="start" id="note-2">Passages show measurement connectivity. Apparatus is schematic and not to scale.</text><text x="47" y="603" fill="#415663" font-size="14" font-weight="400" text-anchor="start" id="note-3">Source: NASA Glenn Research Center, Pitot–Static Tube Speedometer.</text></g></svg>