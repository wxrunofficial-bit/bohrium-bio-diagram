<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="990" height="665" viewBox="0 0 990 665" font-family="DejaVu Sans, Noto Sans CJK SC, Microsoft YaHei, Sans Serif" role="img"><title>Pitot-static airspeed measurement</title><desc>Evidence-linked scientific figure</desc><g id="backdrop" inkscape:groupmode="layer" inkscape:label="Canvas"><rect x="0" y="0" width="990" height="665" fill="#FFFFFF" /><text x="24" y="35" font-size="24" text-anchor="start" font-weight="700" fill="#102A43">Pitot-static airspeed measurement</text><text x="24" y="57" font-size="13" text-anchor="start" font-weight="400" fill="#465F72">Physical pressure paths and the downstream measurement workflow</text></g><g id="panel-setup" inkscape:groupmode="layer" inkscape:label="A   Apparatus and pressure ports"><rect x="20" y="80" width="950" height="285" rx="10" fill="#F8FAFC" stroke="#C7D4DE" /><text x="35" y="106" font-size="17" text-anchor="start" font-weight="700" fill="#102A43">A   Apparatus and pressure ports</text></g><g id="routes-setup" inkscape:groupmode="layer" inkscape:label="Relations"><g id="data-total" data-source="pitot" data-target="transducer"><polyline id="data-total-route" points="253,183 265,183 426,183 438,183" stroke="#2455A4" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M438.0000,183.0000 L427.0000,187.8000 L427.0000,178.2000 Z" fill="#2455A4" /></g><g id="data-ambient" data-source="static" data-target="transducer"><polyline id="data-ambient-route" points="253,293 265,293 426,293 438,293" stroke="#2455A4" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M438.0000,293.0000 L427.0000,297.8000 L427.0000,288.2000 Z" fill="#2455A4" /></g><g id="data-delta" data-source="transducer" data-target="daq"><polyline id="data-delta-route" points="677,237 689,237 754,237 766,237" stroke="#8555A2" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-dasharray="6 4" /><path d="M766.0000,237.0000 L755.0000,241.8000 L755.0000,232.2000 Z" fill="#8555A2" /></g></g><g id="components-setup" inkscape:groupmode="layer" inkscape:label="Entities"><g id="data-pitot"><rect id="data-pitot-box" x="48" y="147" width="205" height="72" rx="9" fill="#E9F1FA" stroke="#2455A4" stroke-width="1.4" /><text x="150.5" y="178.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-pitot-text-0">Forward opening</text><text x="150.5" y="196.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-pitot-text-1">Total pressure pₜ</text></g><g id="data-static"><rect id="data-static-box" x="48" y="257" width="205" height="72" rx="9" fill="#E9F1FA" stroke="#2455A4" stroke-width="1.4" /><text x="150.5" y="288.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-static-text-0">Side openings</text><text x="150.5" y="306.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-static-text-1">Static pressure pₛ</text></g><g id="data-transducer"><rect id="data-transducer-box" x="438" y="151" width="239" height="172" rx="4" fill="#F4EBFA" stroke="#8555A2" stroke-width="1.4" /><text x="557.5" y="241.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-transducer-text-0">Differential transducer</text></g><g id="data-daq"><rect id="data-daq-box" x="766" y="198" width="176" height="78" rx="9" fill="#F4EBFA" stroke="#8555A2" stroke-width="1.4" /><text x="854.0" y="232.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-daq-text-0">Measured Δp</text><text x="854.0" y="250.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-daq-text-1">pₜ − pₛ  [Pa]</text></g></g><g id="notes-setup" inkscape:groupmode="layer" inkscape:label="Annotations"><text x="277" y="173" font-size="13" text-anchor="start" font-weight="400" fill="#102A43" id="data-high-label">High side</text><text x="277" y="283" font-size="13" text-anchor="start" font-weight="400" fill="#102A43" id="data-low-label">Low side</text></g><g id="panel-work" inkscape:groupmode="layer" inkscape:label="B   Measurement and calculation"><rect x="20" y="385" width="950" height="226" rx="10" fill="#F8FAFC" stroke="#C7D4DE" /><text x="35" y="411" font-size="17" text-anchor="start" font-weight="700" fill="#102A43">B   Measurement and calculation</text></g><g id="routes-work" inkscape:groupmode="layer" inkscape:label="Relations"><g id="data-s1" data-source="align" data-target="sense"><polyline id="data-s1-route" points="249,490 261,490 267,490 279,490" stroke="#32465F" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M279.0000,490.0000 L268.0000,494.8000 L268.0000,485.2000 Z" fill="#32465F" /></g><g id="data-s2" data-source="sense" data-target="density"><polyline id="data-s2-route" points="473,490 485,490 491,490 503,490" stroke="#32465F" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M503.0000,490.0000 L492.0000,494.8000 L492.0000,485.2000 Z" fill="#32465F" /></g><g id="data-s3" data-source="density" data-target="velocity"><polyline id="data-s3-route" points="699,490 711,490 718,490 730,490" stroke="#32465F" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M730.0000,490.0000 L719.0000,494.8000 L719.0000,485.2000 Z" fill="#32465F" /></g></g><g id="components-work" inkscape:groupmode="layer" inkscape:label="Entities"><g id="data-align"><rect id="data-align-box" x="48" y="455" width="201" height="70" rx="9" fill="#EBF0F6" stroke="#32465F" stroke-width="1.4" /><text x="148.5" y="485.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-align-text-0">Align inlet</text><text x="148.5" y="503.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-align-text-1">with the flow</text></g><g id="data-sense"><rect id="data-sense-box" x="279" y="455" width="194" height="70" rx="9" fill="#EBF0F6" stroke="#32465F" stroke-width="1.4" /><text x="376.0" y="485.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-sense-text-0">Read pressure</text><text x="376.0" y="503.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-sense-text-1">difference</text></g><g id="data-density"><rect id="data-density-box" x="503" y="455" width="196" height="70" rx="9" fill="#EBF0F6" stroke="#32465F" stroke-width="1.4" /><text x="601.0" y="485.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-density-text-0">Use local</text><text x="601.0" y="503.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-density-text-1">density ρ</text></g><g id="data-velocity"><rect id="data-velocity-box" x="730" y="455" width="210" height="70" rx="9" fill="#F4EBFA" stroke="#8555A2" stroke-width="1.4" /><text x="835.0" y="485.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-velocity-text-0">Compute airspeed</text><text x="835.0" y="503.0" font-size="15.0" text-anchor="middle" font-weight="700" fill="#102A43" id="data-velocity-text-1">V = √(2Δp/ρ)</text></g></g><g id="notes-work" inkscape:groupmode="layer" inkscape:label="Annotations"><text x="50" y="569" font-size="13" text-anchor="start" font-weight="400" fill="#102A43" id="data-scope">Use the incompressible Bernoulli approximation for this calculation.</text></g><g id="legend" inkscape:groupmode="layer" inkscape:label="Legend"><text x="24" y="653" font-size="12" text-anchor="start" font-weight="400" fill="#465F72">Source: NASA Glenn Research Center, Pitot–Static Tube–Speedometer. Schematic, not to scale.</text><polyline id="legend-pressure-route" points="25,636 51,636" stroke="#2455A4" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M51.0000,636.0000 L40.0000,640.8000 L40.0000,631.2000 Z" fill="#2455A4" /><text x="59.0" y="640" font-size="11" text-anchor="start" font-weight="400" fill="#102A43">Pressure connection</text><polyline id="legend-signal-route" points="340,636 366,636" stroke="#8555A2" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-dasharray="6 4" /><path d="M366.0000,636.0000 L355.0000,640.8000 L355.0000,631.2000 Z" fill="#8555A2" /><text x="374.0" y="640" font-size="11" text-anchor="start" font-weight="400" fill="#102A43">Readout / data</text><polyline id="legend-sequence-route" points="655,636 681,636" stroke="#32465F" stroke-width="2.6" fill="none" stroke-linejoin="round" /><path d="M681.0000,636.0000 L670.0000,640.8000 L670.0000,631.2000 Z" fill="#32465F" /><text x="689.0" y="640" font-size="11" text-anchor="start" font-weight="400" fill="#102A43">Operation order</text></g></svg>